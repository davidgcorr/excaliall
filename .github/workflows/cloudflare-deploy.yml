name: Deploy VeDav website to Cloudflare and GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vedav-production
  cancel-in-progress: false

jobs:
  github-pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/github-pages.yml

  deploy:
    if: github.repository == 'davidgcorr/vedav' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://vedav.davidgc.com
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret with Account > Cloudflare Pages > Edit permission for the VeDav account."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn
      - name: Test Pages project setup
        run: node --test scripts/ensure-cloudflare-project.check.cjs
      - name: Ensure VeDav Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab006639687bbee95168d5daa00dde67
        run: node scripts/ensure-cloudflare-project.cjs
      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile
      - name: Check types
        run: corepack yarn test:typecheck
      - name: Test editor
        run: corepack yarn test:app --run --minWorkers=1 --maxWorkers=2
      - name: Build production website
        run: corepack yarn cloudflare:build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab006639687bbee95168d5daa00dde67
          CI: "true"
        run: |
          npx --yes wrangler@4.157.0 pages deploy excalidraw-app/build \
            --project-name=vedav --branch=master --commit-hash="$GITHUB_SHA"
      - name: Verify production website
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 \
            --max-time 30 https://vedav.davidgc.com/ -o /tmp/vedav.html
          node -e 'const html = require("node:fs").readFileSync("/tmp/vedav.html", "utf8"); if (!html.includes("<title>VeDav</title>")) throw new Error("Production did not return the VeDav editor");'
      - name: Publish VeDav to the previous website for existing bookmarks
        if: vars.PREVIOUS_PAGES_PROJECT != ''
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab006639687bbee95168d5daa00dde67
          PREVIOUS_PAGES_PROJECT: ${{ vars.PREVIOUS_PAGES_PROJECT }}
          CI: "true"
        run: |
          npx --yes wrangler@4.157.0 pages deploy "$GITHUB_WORKSPACE/excalidraw-app/build" \
            --project-name="$PREVIOUS_PAGES_PROJECT" --branch=master --commit-hash="$GITHUB_SHA"
      - name: Deployment summary
        run: |
          echo "### VeDav deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Website: https://vedav.davidgc.com" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
