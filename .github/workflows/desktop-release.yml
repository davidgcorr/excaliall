name: macOS desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DESKTOP_SIGNED: ${{ secrets.MAC_CERTIFICATE != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const v = require("./desktop/package.json").version; if (process.env.RELEASE_TAG !== `desktop-v${v}` || !/^\d+\.\d+\.\d+$/.test(v)) process.exit(1)'
      - name: Install dependencies
        run: |
          corepack yarn install --frozen-lockfile
          npm --prefix desktop ci
      - name: Test desktop file isolation
        run: node --test desktop/*.test.cjs
      - name: Build bundled editor
        run: node desktop/scripts/build-web.cjs
      - name: Package universal macOS app
        run: npm --prefix desktop run dist -- --universal
      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-desktop
          path: artifacts
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --draft --title "Excalidraw Animation ${RELEASE_TAG#desktop-v}" --generate-notes --verify-tag
